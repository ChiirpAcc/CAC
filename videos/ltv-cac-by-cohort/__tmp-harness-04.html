<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0a0a}#stage{position:relative;width:1920px;height:1080px}</style>
</head><body><div id="stage"></div>
<script>
window.__timelines = {};
fetch('compositions/frames/04-below-the-bar.html').then(r=>r.text()).then(t=>{
  var host=document.createElement('div'); host.innerHTML=t;
  var tpl=host.querySelector('template');
  var frag=tpl.content.cloneNode(true);
  var stage=document.getElementById('stage');
  Array.from(frag.childNodes).forEach(function(n){
    if(n.tagName==='SCRIPT'){
      if(n.src) return; // gsap already loaded in head
      var s=document.createElement('script'); s.textContent=n.textContent; stage.appendChild(s);
    } else { stage.appendChild(n); }
  });
  window.__seek=function(t){ window.__timelines['04-below-the-bar'].seek(t); };
  window.__ready=true;
});
</script></body></html>
