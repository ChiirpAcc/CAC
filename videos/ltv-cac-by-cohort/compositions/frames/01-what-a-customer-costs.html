    /* ── frame root — styled by #root, never by a class on the composition element ── */
    #root {

      overflow: hidden;
      vertical-align: bottom;

    .wcc-wi {
      display: inline-block;
      /* No CSS transform here. GSAP tweens yPercent on this element, and a CSS

         over: the words stayed parked below the mask and the line never
         appeared. The parked state is the tween's own `from`, stamped at build
         time by immediateRender. */
    }

    /* the hero slot — both figures stand on the SAME baseline, same left edge */
    .wcc-slot {
      position: absolute;
      left: var(--wcc-x);
      top: 23cqw;
      width: var(--wcc-slot-w);

    .wcc-ch {

  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector(
        '[data-composition-id="01-what-a-customer-costs"]'
      );
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

      var grid = q(".wcc-grid");
      var hairs = qa(".wcc-hair");
      var gbars = qa(".wcc-gbar");
      var eyebrow = q(".wcc-eyebrow");
      var ord = q(".wcc-ord");
      var toprule = q(".wcc-toprule");
      var leadWords = qa(".wcc-wi");
      var figA = q(".wcc-fig-a");
      var figAChars = qa(".wcc-fig-a .wcc-ch");
      var figB = q(".wcc-fig-b");
      var labA = q(".wcc-lab-a");
      var labB = q(".wcc-lab-b");
      var brline = q(".wcc-brline");
      var ticks = qa(".wcc-tick");
      var footChrome = q(".wcc-foot-chrome");
      var tag = q(".wcc-tag");

      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.2s) — the grid settles, the eyebrow sets,
            the lead line writes on in the content zone ── */
      tl.fromTo(
        grid,
        { opacity: 0, scale: 1.035 },
        { opacity: 0.65, scale: 1, duration: 0.75, ease: "power2.out" },
        0
      );
      tl.fromTo(
        hairs,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power3.out", stagger: 0.06, immediateRender: false },
        0.05
      );
      tl.fromTo(
        gbars,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.045, immediateRender: false },
        0.12
      );
      tl.fromTo(
        eyebrow,
        { autoAlpha: 0, yPercent: 70 },
        { autoAlpha: 1, yPercent: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        0.18
      );
      tl.fromTo(
        toprule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "power3.out", immediateRender: false },
        0.34
      );
      /* per-word masked slide — the lead line "writes on", left set on 8cqw */
      tl.fromTo(
        leadWords,
        { yPercent: 110 },
        { yPercent: 0, duration: 0.52, ease: "power3.out", stagger: 0.1 },
        0.42
      );
      tl.fromTo(
        ord,
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.4, ease: "none", immediateRender: false },
        0.5
      );

      /* ── Scene 2 (1.2–3.4s) — "$2,583" reveals per character at hero scale,
            then the amber cohort label rises under it ── */
      tl.fromTo(
        figAChars,
        { autoAlpha: 0, yPercent: 10 },
        { autoAlpha: 1, yPercent: 0, duration: 0.24, ease: "power3.out", stagger: 0.078, immediateRender: false },
        1.26
      );
      tl.fromTo(
        labA,
        { autoAlpha: 0, yPercent: 90 },
        { autoAlpha: 1, yPercent: 0, duration: 0.55, ease: "back.out(1.5)", immediateRender: false },
        1.88
      );

      /* ── Scene 3 (3.4–5.8s) — HARD CUT in place.
            Figure and label swap on the SAME frame. Nothing fades. ── */
      tl.set([figA, labA], { autoAlpha: 0 }, 3.4);
      tl.set([figB, labB], { autoAlpha: 1 }, 3.4);

      /* the only motion under the held cut: a whisper of push on the grid field */
      tl.fromTo(
        grid,
        { scale: 1 },
        { scale: 1.014, duration: 4, ease: "none", immediateRender: false },
        3.4
      );

      /* ── Scene 4 (5.8–7.5s) — the amber bracket draws once across the slot
            both figures occupied; the mono tag settles at its midpoint. Holds STILL. ── */
      tl.fromTo(
        brline,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.58, ease: "power2.out", immediateRender: false },
        5.82
      );
      tl.fromTo(
        ticks,
        { scaleY: 0 },
        { scaleY: 1, duration: 0.26, ease: "power3.out", stagger: 0.07, immediateRender: false },
        6.18
      );
      tl.fromTo(
        footChrome,
        { autoAlpha: 0, yPercent: 60 },
        { autoAlpha: 1, yPercent: 0, duration: 0.45, ease: "power3.out", immediateRender: false },
        6.22
      );
      tl.fromTo(
        tag,
        { autoAlpha: 0, yPercent: 70 },
        { autoAlpha: 1, yPercent: 0, duration: 0.55, ease: "back.out(1.4)", immediateRender: false },
        6.3
      );

      /* full-span anchor — the frame's duration is 7.5s */
      tl.to({}, { duration: 7.5 }, 0);

      window.__timelines["01-what-a-customer-costs"] = tl;
    })();
  </script>
