    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ────────────────────────────────────────────────────────────────────
         THIS FRAME'S PAST BUG, and the two guards against it.

         1. gsap.fromTo() defaults to immediateRender: true — the `from`
            values are stamped when the tween is BUILT, not when it plays.
            A fromTo scheduled at 6s with from:{opacity:1} therefore made its
            target visible from t=0, and two caveats printed over each other.
            EVERY fromTo below carries immediateRender: false. No exceptions.
         2. Every hidden start state (caveat opacity, tag opacity, line clip,
            rail fill width, counter opacity) is declared in CSS, so the
            resting frame is correct before GSAP touches anything.

         Zero-duration tweens (gsap.set) ALSO default to immediateRender:true,
         so no set() is used anywhere. The hard cuts are 2ms `to` tweens —
         `to` with a non-zero duration renders lazily and is seek-safe.
         ──────────────────────────────────────────────────────────────────── */
      var IR = false; // immediateRender guard, spelled once, read everywhere

      // A hard cut: the outgoing state is fully gone 2ms BEFORE the incoming
      // one starts, so no sampled frame can ever show two caveats at once.
      var CUT = 0.002;
      function hardCut(outSel, inSel, t) {
        var i;
        for (i = 0; i < outSel.length; i++) {
          tl.to(outSel[i], { opacity: 0, duration: CUT, ease: "none" }, t - CUT);
        }
        for (i = 0; i < inSel.length; i++) {
          tl.to(inSel[i], { opacity: 1, duration: CUT, ease: "none" }, t);
        }
      }

      // A line wipes on left→right. from-state matches the CSS exactly.
      function wipeLine(sel, t) {
        tl.fromTo(
          sel,
          { clipPath: "inset(-14% 100% -14% 0%)" },
          {
            clipPath: "inset(-14% 0% -14% 0%)",
            duration: 0.55,
            ease: "power2.out",
            immediateRender: IR
          },
          t
        );
      }

      // A tag settles into the footnote slot: 14px of lift, then still.
      function settleTag(sel, t) {
        tl.fromTo(
          sel,
          { opacity: 0, y: 14 },
          {
            opacity: 1,
            y: 0,
            duration: 0.6,
            ease: "power2.out",
            immediateRender: IR
          },
          t
        );
      }

      /* ── SCENE 1 (0.0–0.8s) · the header sets once, and never moves again ── */

      tl.fromTo(
        "#m06-frame-rule-top",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out", immediateRender: IR },
        0.0
      );
      tl.fromTo(
        "#m06-frame-rule-bottom",
        { clipPath: "inset(0% 0% 0% 100%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out", immediateRender: IR },
        0.0
      );
      tl.fromTo(
        "#m06-eyebrow",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out", immediateRender: IR },
        0.05
      );
      tl.to("#m06-rail", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.3);
      tl.to("#m06-count-1", { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.4);
      tl.to("#m06-tick-1", { width: "100%", duration: 0.35, ease: "power2.out" }, 0.45);

      /* ── SCENE 2 (0.8–7.8s) · caveat 1 wipes on line by line, tag settles,
            then over five seconds of held reading. 12 words in 7.0s. ── */

      wipeLine("#m06-c1-l1", 0.8);
      wipeLine("#m06-c1-l2", 1.1);
      wipeLine("#m06-c1-l3", 1.4);
      settleTag("#m06-tag-1", 2.0);

        ["#m06-cav-2", "#m06-count-2"],

      tl.to("#m06-tick-2", { width: "100%", duration: 0.35, ease: "power2.out" }, 7.82);

      wipeLine("#m06-c2-l2", 8.1);
      wipeLine("#m06-c2-l3", 8.4);
      settleTag("#m06-tag-2", 9.0);

            still to the last frame. 12 words in 7.0s. There is deliberately

        ["#m06-cav-3", "#m06-count-3"],

      tl.to("#m06-tick-3", { width: "100%", duration: 0.35, ease: "power2.out" }, 15.02);
      wipeLine("#m06-c3-l1", 15.0);
      wipeLine("#m06-c3-l2", 15.22);

      settleTag("#m06-tag-3", 16.2);

      tl.to({}, { duration: 0.01 }, 21.99);

      window.__timelines["06-what-would-make-this-wrong"] = tl;
