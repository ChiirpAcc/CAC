      font-family: "Hanken Grotesk";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("assets/fonts/HankenGrotesk-600.woff2") format("woff2");

    /* ── frame root — styled by #root, never by a class on the composition element ── */
    #root {

      width: 100%;

    }

    /* ── ground: full-bleed paper + the permanent graph-paper grid, on a clip layer ──
       Painted on a clip element, never on #root: the frame root is clip-gated to its

    .lev07-ground {
      position: absolute;
      inset: 0;
      background: var(--lev07-paper);
    }
    .lev07-grid {
      position: absolute;
      inset: 0;

    /* ══ THE SHARED GRID ════════════════════════════════════════════════════════════
       Identical to every other frame in this video: 8cqw left margin, 8cqw right

       is LEFT SET on the 8cqw x-line — it is not centred, because centring the closer
       is what made the video read as a pile of unrelated slides. */

    /* bare clip wrappers carry no layout of their own — their contents are placed
       against #root, which is the positioned ancestor */
    .lev07-layer {
      position: absolute;
      inset: 0;
    }

    /* ── eyebrow zone (top 9cqw) — mono caps, amber, left set ── */
    .lev07-eyebrow {
      position: absolute;
      left: 8cqw;
      top: 9cqw;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 1.3cqw;
      letter-spacing: 0.16em;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--lev07-amber);
      white-space: nowrap;
      opacity: 0; /* initial state lives in CSS — the tween is fromTo + immediateRender:false */
    }

    /* ── content zone (16–46cqw) — the closing line, display-closing, ink, left set ──
       Anchored at the TOP of the zone, not centred in it: the first line then shares the
       same 16cqw top line as every other frame's content, which is the whole point of the

    .lev07-statement {
      position: absolute;
      left: 8cqw;
      right: 8cqw;
      top: 16cqw;
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;

      line-height: 0.96;
      letter-spacing: -0.005em;
      color: var(--lev07-ink);
    }
    /* Each line rides in its own clipping mask so it SLIDES UP into the zone rather than
       fading in place. The padding/negative-margin pair widens the clip box past the
       ascenders and the 'q' descender without changing the line advance. */
    .lev07-mask {
      display: block;
      overflow: hidden;
      padding-top: 1.6cqw;
      margin-top: -1.6cqw;
      padding-bottom: 2.2cqw;
      margin-bottom: -2.2cqw;
    }
    .lev07-line {
      display: block;
      width: fit-content;
      white-space: nowrap;
      /* Parked fully below the mask. 150% clears the whole clip box: the mask runs
         1.6cqw above and 2.2cqw below the 9.02cqw line box, and Newsreader's ascent
         reaches ~1.42cqw above that line box — so 130% would leave the ascender tops
         peeking at t=0. The fromTo drives it home. */
      /* No CSS transform: GSAP tweens yPercent here and must own the property
         outright, or the CSS value stays in force and the line never rises.
         The tween's `from` is the parked state. */
    }

    /* ── footnote zone (top 49cqw) — the two alternatives, mono, ink-soft ── */
    .lev07-footnote {
      position: absolute;
      left: 8cqw;
      right: 8cqw;
      top: 49cqw;
      font-size: 0;
      white-space: nowrap;
    }
    .lev07-alt {
      position: relative;
      display: inline-block;
      margin-right: 6cqw;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 1.5cqw; /* comfortably above the 1.15cqw mono floor */
      letter-spacing: 0.05em;
      line-height: 1.5;
      color: var(--lev07-ink-soft);
      opacity: 0;
    }
    /* the strike. Centred with top+margin (never a CSS translate) because GSAP drives
       scaleX on this same element and would overwrite a transform-based centring. */
    .lev07-strike {
      position: absolute;
      left: -0.3cqw;
      right: -0.3cqw;
      top: 50%;
      margin-top: -0.06cqw;
      height: 0.12cqw;
      background: var(--lev07-ink);
      transform-origin: left center;
      transform: scaleX(0);
    }

    /* ── the close: one amber hairline, drawn over the bottom ink rule between the
       content margins. It draws, it stops, and the frame is still. No logo, no end card. ── */
    .lev07-close {
      position: absolute;
      left: 8cqw;
      right: 8cqw;
      bottom: 3cqw;
      height: 0.16cqw;
      background: var(--lev07-amber);
      transform-origin: left center;
      transform: scaleX(0);
    }

  <div

    <div class="clip lev07-ground" data-start="0" data-duration="6" data-track-index="0">

    <div class="clip lev07-statement" data-start="0" data-duration="6" data-track-index="2">

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Every fromTo below is positioned later than 0, so every one carries
         immediateRender:false — otherwise GSAP applies its `from` values at BUILD time
         and the frame's landed state is wrong on the first seek. The matching initial
         state lives in the CSS above, which is the single source of truth for t=0. */

      /* ── Scene 1 (0.0–2.0s) — the eyebrow sets, then the line slides up. ───────────
         titlecard-reveal, Benefits register: ONE restrained move brings the card in.
         The eyebrow is chrome, not a beat; the slide-up IS the move. */
      tl.fromTo(
        "#lev07-eyebrow",
        { yPercent: 60, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false },
        0.05
      );

      /* the hero. Line 1 is already more than half risen by t=0.5s.
         These two deliberately keep immediateRender ON. Their `from` IS the
         CSS rest state (translateY(150%)), so there is nothing to leak, and
         GSAP has to claim the transform up front or the CSS value stays in
         force and the line never rises. immediateRender:false belongs only on
         a fromTo whose `from` is a VISIBLE state. */
      tl.fromTo(
        "#lev07-l1",
        { yPercent: 150 },
        { yPercent: 0, duration: 0.85, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        "#lev07-l2",
        { yPercent: 150 },
        { yPercent: 0, duration: 0.85, ease: "power3.out" },
        0.5
      );
      /* 1.35–2.02s: the statement simply holds. */

      /* ── Scene 2 (2.0–4.0s) — the alternatives settle, and each is struck in turn. ──
         Settle, strike, settle, strike: the cadence of the line being said. The strike
         is an ink hairline — series red/green carry break-even meaning on this chart and
         are never borrowed for emphasis. */
      tl.fromTo(
        "#lev07-a1",
        { yPercent: 45, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false },
        2.02
      );
      tl.fromTo(
        "#lev07-s1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power2.inOut", transformOrigin: "left center", immediateRender: false },
        2.5
      );
      tl.fromTo(
        "#lev07-a2",
        { yPercent: 45, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false },
        2.92
      );
      tl.fromTo(
        "#lev07-s2",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power2.inOut", transformOrigin: "left center", immediateRender: false },
        3.45
      );

      /* ── Scene 3 (4.0–6.0s) — STILL. One amber hairline draws across the bottom,
         over the ink rule, between the content margins — and stops at 5.65s. The last
         0.35s is dead still. This is the final frame, so the settle is the exit; there
         is nothing after it. No logo, no end card. ─────────────────────────────────── */
      tl.fromTo(
        "#lev07-close",
        { scaleX: 0 },
        { scaleX: 1, duration: 1.45, ease: "power2.out", transformOrigin: "left center", immediateRender: false },
        4.2
      );

      /* hold the timeline open to the full 6s so the final stillness is real footage */
      var hold = { t: 0 };
      tl.to(hold, { t: 1, duration: 0.001, ease: "none" }, 5.999);

      window.__timelines["07-the-lever"] = tl;
    })();
