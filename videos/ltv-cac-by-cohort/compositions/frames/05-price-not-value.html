      /* ─────────────────────────────────────────────────────────────────────

      /* ── Scene 1 (0.0–2.0s) — eyebrow sets, then the first line writes on ── */

        "#pv05-eyebrow",

          y: 0,
          opacity: 1,
          duration: 0.45,
          ease: "power2.out",
          immediateRender: false,

        0.1

      tl.fromTo(
        "#pv05-title-1 .pv05-w",
        { x: -14, y: 12, opacity: 0 },

          x: 0,
          y: 0,
          opacity: 1,
          duration: 0.6,

          duration: 0.6,

          stagger: 0.06,

      /* ── Scene 3 (3.8–5.6s) — the signature move: two cards arrive from

         Then BOTH identical rails draw — before either bar exists. ────────── */

        "#pv05-card-left",
        { x: -260, rotateY: 13, opacity: 0 },
        {
          x: 0,
          rotateY: 0,
          opacity: 1,
          duration: 0.95,
          ease: "power3.out",
          immediateRender: false,
        },
        3.8
      );
      tl.fromTo(
        "#pv05-card-right",
        { x: 260, rotateY: -13, opacity: 0 },
        {
          x: 0,
          rotateY: 0,
          opacity: 1,
          duration: 0.95,

        { y: 10, opacity: 0 },
        {
          y: 0,
          opacity: 1,
          duration: 0.5,
          ease: "power2.out",

          duration: 0.65,

      tl.fromTo(
