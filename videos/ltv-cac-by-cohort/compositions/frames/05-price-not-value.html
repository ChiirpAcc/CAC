      tl.fromTo("#pnv05-tickmax-a",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.28, ease: "power2.out", transformOrigin: "bottom center" }, 3.02);
      tl.fromTo("#pnv05-valmax-a",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, 3.06);

      /* ══ Scene 3 (3.6–5.4s) ═══════════════════════════════════════════════════════
         Bar B: $5,126 → $9,367 = 285px on the SAME scale — 1.81× the left bar, and it
         starts just past where the left bar ended. Same linear pixel velocity as Bar A,
         so the extra 1.45s of draw IS the extra money. */
      tl.fromTo("#pnv05-bar-b",
        { scaleX: 0 },
        { scaleX: 1, duration: 1.45, ease: "none", transformOrigin: "left center" }, 3.68);
      tl.fromTo("#pnv05-tickmin-b",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.30, ease: "power2.out", transformOrigin: "top center" }, 3.70);
      tl.fromTo("#pnv05-valmin-b",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, 3.74);
      tl.fromTo("#pnv05-tickmax-b",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.28, ease: "power2.out", transformOrigin: "bottom center" }, 5.06);
      tl.fromTo("#pnv05-valmax-b",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.40, ease: "power2.out" }, 5.10);

      /* ══ Scene 4 (5.4–7.0s) ═══════════════════════════════════════════════════════
         The blueprint's punctuation: an inner-edge badge pops on each card, growing
         out of the centre seam. The one overshoot in the shot, kept to a whisper so it
         still reads as ink on paper rather than cartoon wobble. */
      tl.fromTo("#pnv05-badge-a",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "back.out(1.25)" }, 5.46);
      tl.fromTo("#pnv05-badge-b",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.52, ease: "back.out(1.25)" }, 5.78);

      /* ══ Scene 5 (7.0–9.0s) ═══════════════════════════════════════════════════════
         A short rule opens, then the line writes on word by word and everything is
         STILL for the last ~0.7s into the cut. */
      tl.fromTo("#pnv05-closerule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.60, ease: "power2.inOut", transformOrigin: "center center" }, 6.96);
      tl.fromTo("#pnv05-close-1 .pnv05-w",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.50, ease: "power3.out", stagger: 0.055 }, 7.02);
      tl.fromTo("#pnv05-close-2 .pnv05-w",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.50, ease: "power3.out", stagger: 0.055 }, 7.52);

      /* ══ counter-phase idle (1.75–7.0s) ═══════════════════════════════════════════
         sine-wave-loop, onUpdate form, at the LOW end of its amplitude range: the two
         cards bob in opposite phase (left sin(p), right sin(p+π)) so they never
         conveyor-belt. Deterministic — no repeat, no yoyo, no wall clock. sin(0)=0 at
         the start and an amplitude envelope drives it to exactly 0 by 7.0s, so the
         closing line lands on a completely static frame. */
      var IDLE_START = 1.75, IDLE_DUR = 5.25, CYCLES = 1.75, Y_AMP = 2.2, FADE = 0.25;
      var phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var t = phase.p / (Math.PI * 2 * CYCLES);
          var env = t < 1 - FADE ? 1 : Math.max(0, (1 - t) / FADE);
          var a = document.getElementById("pnv05-float-a");
          var b = document.getElementById("pnv05-float-b");
          if (a) a.style.transform = "translateY(" + (Math.sin(phase.p) * Y_AMP * env).toFixed(3) + "px)";
          if (b) b.style.transform = "translateY(" + (Math.sin(phase.p + Math.PI) * Y_AMP * env).toFixed(3) + "px)";
        }
      }, IDLE_START);

      /* hold the full allocated duration — the last ~0.7s is pure stillness */
      tl.to({}, { duration: 9 }, 0);

      window.__timelines["05-price-not-value"] = tl;
      tl.seek(0);
    })();
  </script>
