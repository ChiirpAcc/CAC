  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Canvas is a fixed 1920×1080 render, so tween offsets are authored in px
      // (1cqw = 19.2px). Every initial state lives in CSS; every fromTo placed
      // later than 0 carries immediateRender:false so no start state leaks to t=0.

      // ── Scene 1 (0.0–2.0s) — the eyebrow sets, then the numerator writes on ──
      tl.fromTo(
        ".m02-eyebrow",
        { opacity: 0, y: 17 },
        {
          opacity: 1,
          y: 0,
          duration: 0.55,
          ease: "power2.out",
          immediateRender: false
        },
        0.15
      );

      tl.fromTo(
        ".m02-num .w",
        { opacity: 0, yPercent: 140 },
        {
          opacity: 1,
          yPercent: 0,
          duration: 0.62,
          ease: "power3.out",
          stagger: 0.085,
          immediateRender: false
        },
        0.25
      );

      // ── Scene 2 (2.0–4.0s) — the division rule draws L→R, denominator settles ──
      tl.fromTo(
        ".m02-bar",
        { opacity: 0, scaleX: 0 },
        {
          opacity: 1,
          scaleX: 1,
          transformOrigin: "0% 50%",
          duration: 0.8,
          ease: "power2.inOut",
          immediateRender: false
        },
        2.05
      );

      tl.fromTo(
        ".m02-den .w",
        { opacity: 0, yPercent: 140 },
        {
          opacity: 1,
          yPercent: 0,
          duration: 0.6,
          ease: "power3.out",
          stagger: 0.1,
          immediateRender: false
        },
        2.7
      );

      // ── Scene 3 (4.0–6.2s) — the "per logo" tag springs in; footnote sets ──
      tl.fromTo(
        ".m02-tag",
        { opacity: 0, scale: 0.68 },
        {
          opacity: 1,
          scale: 1,
          transformOrigin: "0% 50%",
          duration: 0.62,
          ease: "back.out(2.4)",
          immediateRender: false
        },
        4.1
      );

      tl.fromTo(
        ".m02-foot-copy",
        { opacity: 0, x: -23 },
        {
          opacity: 1,
          x: 0,
          duration: 0.7,
          ease: "power2.out",
          immediateRender: false
        },
        4.85
      );

      // ── Scene 4 (6.2–9.4s) — the fraction lifts and compacts to ~a third of
      //    its height, then the 24-tick cohort ribbon draws in one sweep ──
      tl.to(
        ".m02-frac",
        {
          scale: 0.38,
          y: -19.2,
          transformOrigin: "0% 0%",
          duration: 1.05,
          ease: "power3.inOut"
        },
        6.3

      tl.fromTo(

        { opacity: 0, y: 21 },

          ease: "power2.out",

          scaleX: 1,
          transformOrigin: "0% 50%",
          duration: 1.2,
          ease: "power2.out",
          immediateRender: false

      tl.fromTo(

        { opacity: 0, scaleY: 0 },

          opacity: 1,
          scaleY: 1,
          transformOrigin: "50% 100%",
          duration: 0.3,
          ease: "power2.out",
          stagger: 0.05,
          immediateRender: false

      tl.fromTo(

      tl.to({}, { duration: 0.01 }, 10.99);

      window.__timelines["02-what-it-measures"] = tl;
