  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Every hidden-at-t=0 element already carries its own CSS start state
         (opacity:0 / clip-path inset). Every fromTo positioned later than 0
         therefore carries immediateRender:false — a fromTo defaults to
         immediateRender:true and applies its FROM values when the tween is
         BUILT, which is exactly what leaked the goal rule onto frame 0 before. */
      var LATE = { immediateRender: false };
      function to(vars, extra) {
        var o = {};
        for (var k in vars) o[k] = vars[k];
        for (var j in extra) o[j] = extra[j];
        return o;
      }

      /* ═══ Scene 1 (0.0–1.2s) ══════════════════════════════════════════════
         The measured plane arrives: grid settles, the two frame hairlines draw,

         draw left→right across the full content zone — the shared grid made

      tl.fromTo(
        "#m03-grid",

        tl.fromTo(
          sel,
          { clipPath: "inset(0% 100% 0% 0%)" },
          to({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.52, ease: "power2.inOut" }, LATE),
          0.3 + i * 0.16
        );
      });
      ["#m03-ord-1", "#m03-ord-2", "#m03-ord-3"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0 },
          to({ opacity: 1, duration: 0.34, ease: "power1.out" }, LATE),
          0.62 + i * 0.16
        );
      });

      /* ── the count-up driver ───────────────────────────────────────────────
         A numeric proxy tweened ON THE TIMELINE and written inside the tween's
         OWN RENDER via `modifiers` — not via onUpdate. A renderer walks the
         timeline with seek()/time(), and BOTH suppress callbacks by default
         (gsap's suppressEvents defaults to true), so an onUpdate count-up paints
         "$0" on every rendered frame. A modifier is part of the PropTween render
         pipeline, so it runs on every seek, forwards and backwards.
         No clock, no rAF. At progress 1 the proxy holds the exact integer, so
         $2,583 and $9,696 render verbatim.                                     */
      var figCost = document.getElementById("m03-fig-cost");
      var figProfit = document.getElementById("m03-fig-profit");

      function money(n) {
        return "$" + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      var costProxy = { v: 0 };
      var profitProxy = { v: 0 };

      /* ═══ Scene 2 (1.2–3.2s) ══════════════════════════════════════════════
         Column 01. The name sets, then the cost counts up from zero in mono,
         teal — the neutral series, the money spent.                          */

      tl.fromTo(
        "#m03-lab-1a",
        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),
        1.22
      );
      tl.fromTo(
        "#m03-lab-1b",
        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),
        1.32
      );
      tl.fromTo(
        "#m03-fig-cost",
        { opacity: 0, y: 18 },
        to({ opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, LATE),
        1.58
      );
      tl.fromTo(
        costProxy,
        { v: 0 },
        to(
          {
            v: 2583,
            duration: 1.3,
            ease: "power2.out",
            lazy: false,
            modifiers: {
              v: function (v) {
                figCost.textContent = money(v);
                return v;
              },
            },
          },
          LATE
        ),
        1.58
      );

      /* ═══ Scene 3 (3.2–5.2s) ══════════════════════════════════════════════
         Column 02 fills the same way and lands on the SAME baseline as 01.
         Green: at or above break-even — the money that came back.            */

      tl.fromTo(
        "#m03-lab-2a",
        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),
        3.22

      tl.fromTo(
        "#m03-lab-2b",
        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),
        3.32
      );
      tl.fromTo(
        "#m03-fig-profit",
        { opacity: 0, y: 18 },
        to({ opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, LATE),
        3.58
      );
      tl.fromTo(
        profitProxy,
        { v: 0 },
        to(
          {
            v: 9696,
            duration: 1.3,
            ease: "power2.out",
            lazy: false,
            modifiers: {
              v: function (v) {
                figProfit.textContent = money(v);
                return v;
              },
            },
          },
          LATE
        ),
        3.58
      );

      /* ═══ Scene 4 (5.2–7.0s) ══════════════════════════════════════════════
         Column 03 resolves. A hairline draws top-down to divide the two
         counters from their quotient, the name sets, and 3.75x springs in

      tl.fromTo(

        { clipPath: "inset(0% 0% 100% 0%)" },
        to({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, LATE),

        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),

      tl.fromTo(
        "#m03-lab-3b",
        { opacity: 0, y: 14 },
        to({ opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, LATE),

      gsap.utils.toArray(".m03-hch").forEach(function (ch, i) {
        tl.fromTo(
          ch,
          { opacity: 0, scale: 0.6, y: 22 },
          to(
            { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: "back.out(2.2)" },
            LATE
          ),
          5.74 + i * 0.07
        );
      });

      /* the footnote settles under the composition as scene 4 lands, so the
         held read of scene 5 is the goal rule alone */
      tl.fromTo(
        "#m03-footnote",
        { opacity: 0, y: 8 },
        to({ opacity: 1, y: 0, duration: 0.44, ease: "power2.out" }, LATE),

      /* ═══ Scene 5 (7.0–8.5s) ══════════════════════════════════════════════
         The dashed 3.0x reference draws in BENEATH the ratio — hidden by its
         own CSS clip-path until this instant, never before. Then STILL.      */

      tl.fromTo(

        { clipPath: "inset(0% 100% 0% 0%)" },
        to({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.72, ease: "power2.inOut" }, LATE),

      /* the held read: an empty tween carries the timeline out to the frame's
         full 8.5s so its duration matches data-duration and the last 0.7s is an
         explicit STILL, not an accidental short timeline. */
      tl.to({}, { duration: 0.68 }, 7.82);

      window.__timelines["03-the-model-worked"] = tl;
      tl.seek(0);
    })();
  </script>
