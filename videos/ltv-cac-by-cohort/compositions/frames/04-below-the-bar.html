  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–1.0s) — the eyebrow sets, the baseline draws left → right.
           Nothing above the baseline yet. ── */
      tl.fromTo(
        ["#btb04-eyebrow", "#btb04-fig"],
        { opacity: 0, yPercent: 40 },
        { opacity: 1, yPercent: 0, duration: 0.55, ease: "power2.out", stagger: 0.07 },

        "#btb04-baseline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "power2.inOut", immediateRender: false },
        0.18
      );

      /* ── Scene 2 (1.0–4.4s) — 24 columns grow from the baseline in a staggered
           left-to-right cascade. Heights carry the real ratios on one shared
           linear scale; colour is fixed in the markup (grey wins over red). ── */
      tl.fromTo(
        ".btb04-bar",
        { scaleY: 0 },
        {
          scaleY: 1,
          duration: 0.62,
          ease: "power2.out",
          stagger: 0.118,
          immediateRender: false
        },
        1.0
      );
      tl.fromTo(
        ".btb04-val",
        { opacity: 0, yPercent: 40 },
        {
          opacity: 1,
          yPercent: 0,
          duration: 0.4,
          ease: "power1.out",
          stagger: 0.118,
          immediateRender: false
        },
        1.22
      );
      tl.fromTo(
        ".btb04-tick",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.5,
          ease: "power1.out",
          stagger: 0.62,
          immediateRender: false
        },
        1.3
      );

      /* ── Scene 3 (4.4–6.0s) — the dashed break-even rule draws across at exactly
           the 1.0 height, over the columns, then its label lands. ── */
      tl.fromTo(
        "#btb04-be",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.95, ease: "power2.inOut", immediateRender: false },
        4.5
      );
      tl.fromTo(
        "#btb04-be-label",
        { opacity: 0, yPercent: 35 },
        { opacity: 1, yPercent: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
        5.35
      );

      /* ── Scene 4 (6.0–7.6s) — the SEVEN red columns pulse once, together.
           Grey never pulses. The pulse is scaleX + opacity only, so no column's
           height (its ratio) is ever distorted. Two explicit tweens — no yoyo. ── */
      tl.fromTo(
        ".btb04-neg",
        { scaleX: 1, opacity: 1 },
        { scaleX: 1.2, opacity: 0.78, duration: 0.55, ease: "power2.out", immediateRender: false },
        6.05
      );
      tl.fromTo(
        ".btb04-neg",
        { scaleX: 1.2, opacity: 0.78 },
        { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        6.6
      );
      tl.fromTo(
        "#btb04-count",
        { opacity: 0, yPercent: 30 },
        { opacity: 1, yPercent: 0, duration: 0.62, ease: "power2.out", immediateRender: false },
        6.25
      );

      /* ── Scene 5 (7.6–9.0s) — the grey disclaimer fades into the footnote zone
           with a bracket spanning the five grey columns. ── */
      tl.fromTo(
        "#btb04-bracket",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power2.out", immediateRender: false },
        7.68
      );
      tl.fromTo(
        "#btb04-note",
        { opacity: 0, yPercent: 30 },
        { opacity: 1, yPercent: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
        7.95
      );

      /* ── Scene 6 (9.0–12.0s) — ABSOLUTE STILLNESS. The last visible motion ends
           at 8.50s. This inert data tween only carries the timeline out to 12s;
           it touches no element, so nothing on screen drifts or breathes. ── */
      tl.to({ hold: 0 }, { hold: 1, duration: 3.5, ease: "none" }, 8.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-below-the-bar"] = tl;
    })();
