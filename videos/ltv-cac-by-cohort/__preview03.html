<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0a0a}
#host{position:relative;width:1920px;height:1080px}
</style></head><body>
<div id="host"></div>
<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    /* Faces actually used by this frame. Real .woff2 staged in the project at
       assets/fonts/ — project-root-relative, never a network fetch (determinism). */
    @font-face {
      font-family: "DM Mono";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("assets/fonts/DMMono-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "DM Mono";
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("assets/fonts/DMMono-500.woff2") format("woff2");
    }
    @font-face {
      font-family: "Hanken Grotesk";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("assets/fonts/HankenGrotesk-600.woff2") format("woff2");
    }

    /* ── frame root — styled by #root, never by a class on the composition element ── */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      /* frame.md tokens */
      --mw03-paper: #f4f5f6;
      --mw03-ink: #15181c;
      --mw03-ink-soft: #474d55;
      --mw03-grid: rgba(21, 24, 28, 0.08);
      --mw03-ink-faint: rgba(21, 24, 28, 0.16);
      /* series — meaning, never decoration */
      --mw03-teal: #1f6f8b; /* neutral series: what it cost */
      --mw03-positive: #2e7d5b; /* at or above break-even */
      --mw03-amber: #b07d2b; /* accent label */
    }

    /* ── ground: full-bleed paper + permanent graph-paper grid, on a clip layer ── */
    .mw03-ground {
      position: absolute;
      inset: 0;
      background: var(--mw03-paper);
    }
    .mw03-grid {
      position: absolute;
      inset: 0;
      /* ~2cqw cells, 10% ink — background role, dimmed ~35% */
      background-image:
        linear-gradient(to right, var(--mw03-grid) 0.06cqw, transparent 0.06cqw),
        linear-gradient(to bottom, var(--mw03-grid) 0.06cqw, transparent 0.06cqw);
      background-size: 2cqw 2cqw;
      background-position: 0 0;
      opacity: 0.65;
    }
    /* the two persistent hairlines framing every composition */
    .mw03-hair {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      height: 0.12cqw;
      background: var(--mw03-ink);
    }
    .mw03-hair-top {
      top: 3cqw;
    }
    .mw03-hair-bottom {
      bottom: 3cqw;
    }

    /* ── the cohort label (amber accent) ── */
    .mw03-cohort {
      position: absolute;
      left: 0;
      right: 0;
      top: 9.1cqw;
      text-align: center;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 1.5cqw;
      line-height: 1;
      letter-spacing: 0.16em;
      color: var(--mw03-amber);
    }
    /* decorative catalogue ordinal (mono chrome) */
    .mw03-fig {
      position: absolute;
      right: 4cqw;
      top: 9.1cqw;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 400;
      font-size: 1.5cqw;
      line-height: 1;
      letter-spacing: 0.06em;
      color: var(--mw03-ink-faint);
    }

    /* ── the triptych: three columns marked by hairline rules ── */
    .mw03-tri {
      position: absolute;
      left: 4cqw;
      top: 15.6cqw;
      width: 92cqw;
      height: 20.8cqw;
    }
    .mw03-col {
      position: absolute;
      top: 0;
      bottom: 0;
    }
    .mw03-col-1 {
      left: 0;
      width: 26cqw;
    }
    .mw03-col-2 {
      left: 26cqw;
      width: 28cqw;
    }
    .mw03-col-3 {
      left: 54cqw;
      width: 38cqw;
    }
    .mw03-coltop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0.12cqw;
      background: var(--mw03-ink);
      transform-origin: left center;
    }
    .mw03-div {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0.06cqw;
      background: var(--mw03-ink-faint);
      transform-origin: center top;
    }
    .mw03-div-a {
      left: 26cqw;
    }
    .mw03-div-b {
      left: 54cqw;
    }
    .mw03-label {
      position: absolute;
      top: 1.2cqw;
      left: 0;
      font-family: "Hanken Grotesk", sans-serif;
      font-weight: 600;
      font-size: 1.15cqw;
      line-height: 1.2;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mw03-ink-soft);
      white-space: nowrap;
    }
    /* the figures — tabular mono numerals, sharing one baseline */
    .mw03-fig-num {
      position: absolute;
      left: 0;
      bottom: 3.1cqw;
      display: block;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 3.9cqw;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      transform-origin: left bottom;
      white-space: nowrap;
    }
    #mw03-cost {
      color: var(--mw03-teal);
    }
    #mw03-profit {
      color: var(--mw03-positive);
    }
    /* the hero: the ratio */
    #mw03-ratio {
      position: absolute;
      left: 0;
      bottom: 1.5cqw;
      display: block;
      font-family: "DM Mono", ui-monospace, monospace;
      font-weight: 500;
      font-size: 11.5cqw;
      line-height: 1;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      color: var(--mw03-positive);
      transform-origin: left bottom;
      white-space: nowrap;
    }

    /* ── the hairline that divides the two figures ── */
    .mw03-oprule {
      position: absolute;
      left: 4cqw;
      top: 37.1cqw;
      width: 54cqw;
      height: 0.12cqw;
      background: var(--mw03-ink);
      transform-origin: left center;
    }

    /* ── the 3.0x goal reference (supporting) ── */
    .mw03-goalrule {
      position: absolute;
      left: 58cqw;
      top: 39.5cqw;
      width: 38cqw;
      height: 0.12cqw;
      background-image: repeating-linear-gradient(
        to right,
        var(--mw03-ink-soft) 0 0.6cqw,
        transparent 0.6cqw 1.2cqw
      );
    }
    .mw03-goallabel {
      position: absolute;
      left: 58cqw;
      top: 40.2cqw;
      font-family: "Hanken Grotesk", sans-serif;
      font-weight: 600;
      font-size: 1.15cqw;
      line-height: 1.2;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mw03-ink-soft);
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="03-the-model-worked"
    data-start="0"
    data-duration="9"
    data-width="1920"
    data-height="1080"
  >
    <!-- background: paper + permanent grid + the two hairlines -->
    <div class="clip mw03-ground" data-start="0" data-duration="9" data-track-index="0">
      <div class="mw03-grid"></div>
      <div class="mw03-hair mw03-hair-top"></div>
      <div class="mw03-hair mw03-hair-bottom"></div>
    </div>

    <div
      id="mw03-cohort"
      class="clip mw03-cohort"
      data-start="0"
      data-duration="9"
      data-track-index="1"
    >2024-10 COHORT</div>

    <div
      id="mw03-figtag"
      class="clip mw03-fig"
      data-start="0"
      data-duration="9"
      data-track-index="2"
    >FIG. 03</div>

    <!-- the triptych -->
    <div class="clip mw03-tri" data-start="0" data-duration="9" data-track-index="3">
      <i id="mw03-div-a" class="mw03-div mw03-div-a"></i>
      <i id="mw03-div-b" class="mw03-div mw03-div-b"></i>

      <div class="mw03-col mw03-col-1">
        <i id="mw03-top-1" class="mw03-coltop"></i>
        <div id="mw03-label-1" class="mw03-label">Cost per logo</div>
        <span id="mw03-cost" class="mw03-fig-num">$0</span>
      </div>

      <div class="mw03-col mw03-col-2">
        <i id="mw03-top-2" class="mw03-coltop"></i>
        <div id="mw03-label-2" class="mw03-label">Gross profit per logo</div>
        <span id="mw03-profit" class="mw03-fig-num">$0</span>
      </div>

      <div class="mw03-col mw03-col-3">
        <i id="mw03-top-3" class="mw03-coltop"></i>
        <div id="mw03-label-3" class="mw03-label">Ratio</div>
        <span id="mw03-ratio">3.75x</span>
      </div>
    </div>

    <i
      id="mw03-oprule"
      class="clip mw03-oprule"
      data-start="0"
      data-duration="9"
      data-track-index="4"
    ></i>

    <i
      id="mw03-goalrule"
      class="clip mw03-goalrule"
      data-start="0"
      data-duration="9"
      data-track-index="5"
    ></i>
    <div
      id="mw03-goallabel"
      class="clip mw03-goallabel"
      data-start="0"
      data-duration="9"
      data-track-index="6"
    >3.0x goal</div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var costEl = document.getElementById("mw03-cost");
      var profitEl = document.getElementById("mw03-profit");
      var cost = { value: 0 };
      var profit = { value: 0 };

      function money(v) {
        return "$" + Math.round(v).toLocaleString("en-US");
      }

      /* ── Scene 1 (0.0–1.2s) — the cohort label sets dead centre, then rises to the
         top third to clear the field; the triptych frame draws itself in behind it. ── */
      tl.fromTo(
        "#mw03-cohort",
        { opacity: 0, y: 330, scale: 0.98 },
        { opacity: 1, y: 330, scale: 1, duration: 0.42, ease: "power3.out" },
        0.06
      );
      tl.to("#mw03-cohort", { y: 0, duration: 0.56, ease: "power3.inOut" }, 0.56);

      tl.fromTo(
        "#mw03-figtag",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0.62
      );

      /* three empty columns marked by hairline rules */
      ["#mw03-top-1", "#mw03-top-2", "#mw03-top-3"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.42, ease: "power2.inOut" },
          0.55 + i * 0.1
        );
      });
      ["#mw03-div-a", "#mw03-div-b"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.34, ease: "power2.out" },
          0.8 + i * 0.08
        );
      });

      /* ── Scene 2 (1.2–3.2s) — the left column fills: label, then the cost counts up
         from zero in teal. Count-up only; nothing else moves. (counting-dynamic-scale) ── */
      tl.fromTo(
        "#mw03-label-1",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        1.26
      );
      tl.fromTo("#mw03-cost", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.52);
      tl.fromTo(
        cost,
        { value: 0 },
        {
          value: 2583,
          duration: 1.45,
          ease: "power3.out",
          onUpdate: function () {
            costEl.textContent = money(cost.value);
          },
        },
        1.52
      );
      tl.fromTo(
        "#mw03-cost",
        { scale: 0.56 },
        { scale: 1, duration: 1.45, ease: "power3.out" },
        1.52
      );

      /* ── Scene 3 (3.2–5.4s) — the centre column fills the same way, in green.
         Both figures now sit on one baseline; the eye compares them unprompted. ── */
      tl.fromTo(
        "#mw03-label-2",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        3.26
      );
      tl.fromTo("#mw03-profit", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 3.52);
      tl.fromTo(
        profit,
        { value: 0 },
        {
          value: 9696,
          duration: 1.5,
          ease: "power3.out",
          onUpdate: function () {
            profitEl.textContent = money(profit.value);
          },
        },
        3.52
      );
      tl.fromTo(
        "#mw03-profit",
        { scale: 0.56 },
        { scale: 1, duration: 1.5, ease: "power3.out" },
        3.52
      );

      /* ── Scene 4 (5.4–7.2s) — a hairline divides the two figures and the ratio
         springs in at hero scale, green, the largest thing on screen.
         (spring-pop-entrance, smooth power3 settle — no overshoot on data) ── */
      tl.fromTo(
        "#mw03-oprule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.62, ease: "power2.inOut" },
        5.44
      );
      tl.fromTo(
        "#mw03-label-3",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        5.7
      );
      tl.fromTo(
        "#mw03-ratio",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.78, ease: "power3.out" },
        6.02
      );

      /* ── Scene 5 (7.2–9.0s) — the dashed 3.0x reference draws in beneath the ratio,
         which sits clearly above it. Then a full stop: held STILL, no drift. ── */
      tl.fromTo(
        "#mw03-goalrule",
        { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.72, ease: "power2.inOut" },
        7.28
      );
      tl.fromTo(
        "#mw03-goallabel",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" },
        7.74
      );

      /* span the full allocated duration — the last ~0.8s is pure stillness */
      tl.to({}, { duration: 9 }, 0);

      window.__timelines["03-the-model-worked"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
<script>
window.__timelines = {};
(function(){
  const tpl=document.querySelector('template');
  const frag=tpl.content.cloneNode(true);
  const scripts=[...frag.querySelectorAll('script')];
  scripts.forEach(s=>s.remove());
  document.getElementById('host').appendChild(frag);
  (function next(i){
    if(i>=scripts.length){ window.__ready=true; return; }
    const s=document.createElement('script');
    if(scripts[i].src){ s.src=scripts[i].src; s.onload=()=>next(i+1); document.body.appendChild(s); }
    else { s.textContent=scripts[i].textContent; document.body.appendChild(s); next(i+1); }
  })(0);
})();
</script></body></html>
