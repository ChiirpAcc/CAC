name: Sync data

on:
  schedule:
    # 13:00 UTC on weekdays, which is early morning in the United States.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: Why this sync is being run by hand
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-data
  # Never interrupt a run partway through. A cancelled job can leave data/
  # half written, and the next run would commit a mixture of two pulls.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
        run: python scripts/pull_sheet.py

      - name: Commit if data changed
        env:
          REASON: ${{ inputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "No change in data/, nothing to commit."
            exit 0
          fi

          {
            echo "Sync workbook data"
            echo
            python scripts/commit_summary.py "$REASON"
          } > /tmp/commit-message.txt
          cat /tmp/commit-message.txt

          git commit -F /tmp/commit-message.txt --cleanup=whitespace
          git push
