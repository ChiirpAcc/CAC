name: Deploy site

on:
  push:
    branches: [main]
    # Data arrives as a commit pushed from the workbook Apps Script, so a
    # data commit has to redeploy the site just as a site change does.
    paths:
      - 'data/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not cancel. The workbook push arrives as one commit per tab, seven of
  # them within about twenty seconds, and each fires this workflow. Cancelling
  # in progress raced badly: an early run finished and published while the
  # final run, the one carrying the updated index, was cancelled. The site
  # then served a stale index that listed fewer files than the repository
  # held. Queueing instead is slower and ends on the newest commit.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Redraw the animations
        # These are rendered from data/, so a data push makes a committed copy
        # stale immediately. Rebuilding them here means what the site serves is
        # always drawn from the same push as everything else on the page.
        run: |
          python -m pip install --quiet pillow
          python scripts/make_gifs.py site/media

      - name: Assemble the site
        # There is no build step. The site is vanilla HTML, CSS and JavaScript,
        # and it reads the JSON straight out of data/, so the two directories
        # just get laid out next to each other.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp -r data/. _site/data/
          rm -f _site/data/README.md

          # Stamp the commit onto every module and stylesheet reference.
          #
          # Pages caches JavaScript for several minutes but revalidates the
          # HTML sooner, so a deploy can leave a browser running new markup
          # against old modules. That fails silently and is hard to spot: the
          # new figures are in the page, the code that fills them is not, and
          # the charts come out empty with nothing in the console. Versioning
          # the references makes a changed module a different URL, so the stale
          # copy cannot be served.
          VERSION="${GITHUB_SHA::12}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          for path in list(Path('_site').glob('*.js')) + [Path('_site/index.html')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r"from '\./([\w-]+\.js)'", rf"from './\1?v={version}'", text)
              text = re.sub(r'src="([\w-]+\.js)"', rf'src="\1?v={version}"', text)
              text = re.sub(r'href="(styles\.css)"', rf'href="\1?v={version}"', text)
              path.write_text(text, encoding='utf-8')
          print(f'Stamped module references with {version}')
          PY

          echo "Deploying:"
          find _site -type f | sort | sed 's/^/  /'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
